<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Work+Sans&display=swap"
        rel="stylesheet">
    <meta name="description" content="">
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
    <header>
        <h1>Sophie Bluel <span>Architecte d'intérieur</span></h1>
        <nav>
            <ul>
                <li><a href="index.html">projets</a></li>
                <li><a href="index.html#contact">contact</a></li>
                <li><a href="login.html" id="auth-button">login</a></li>
                <li><img src="./assets/icons/instagram.png" alt="Instagram"></li>
            </ul>
        </nav>
    </header>
    
    <div class="login-container">
        <h2>Log In</h2>
        
        <div id="error-message" class="message error-message" style="display: none;">
            <p></p>
        </div>
        <div id="success-message" class="message success-message" style="display: none;">
            <p></p>
        </div>
        
        <form id="login-form">
            <div class="form-group-login">
                <label for="email">E-mail</label>
                <input class="login-input" type="email" id="email" required>
            </div>
            
            <div class="form-group-login">
                <label for="password">Mot de passe</label>
                <input class="login-input" type="password" id="password" required>
            </div>
            
            <button class="submit-btn" type="submit">Se connecter</button>
            
        </form>
    </div>
    
    <script type="module" src="js/login.js"></script>
</body>
</html>
